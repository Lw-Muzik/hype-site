# Baseline response headers for every location.
#
# This lives in its own file because nginx's `add_header` inheritance is
# all-or-nothing: the moment a location block declares ONE add_header of its
# own, it stops inheriting every add_header from the server block. Locations
# that set their own Cache-Control must therefore `include` this file
# explicitly, or the site would silently ship without security headers.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
