# Full replacement for the packaged /etc/nginx/nginx.conf.
#
# Two things differ from the stock file, both so the container can run
# unprivileged and with a read-only root filesystem:
#   1. no `user` directive — the image already drops to the `nginx` user, and
#      keeping it only produces a warning once the master isn't root;
#   2. every path nginx writes to (pid file, temp dirs) lives under /tmp,
#      which the deploy mounts as a small tmpfs. nginx creates those
#      directories itself at startup.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  # Older mime.types files lack .webmanifest. A second `types` block at the SAME
  # level adds to the included map; one in a nested block would replace it. The
  # manifest isn't an image, so it falls to the `no-cache` default location.
  types {
    application/manifest+json webmanifest;
  }
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;
  keepalive_timeout 65;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types      text/plain text/css text/javascript application/javascript
                  application/json image/svg+xml application/manifest+json
                  application/xml text/xml application/ld+json;

  server {
    # 9500, not 80: an unprivileged process cannot bind a port below 1024, and
    # the container runs with --cap-drop ALL (so no CAP_NET_BIND_SERVICE).
    listen      9500;
    listen      [::]:9500;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Deploy health probe, and what the image's HEALTHCHECK hits — so the
    # workflow can tell "container started" from "container is serving".
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # SvelteKit writes content-hashed filenames here, so a URL's contents can
    # never change — cache for a year, never revalidate.
    location /_app/immutable/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      try_files $uri =404;
    }

    # The client polls this to notice a new deploy — caching it would defeat
    # the mechanism.
    location = /_app/version.json {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # static/ assets keep their filenames across deploys, so they get a finite
    # cache rather than an immutable one.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=2592000" always;
      access_log off;
    }

    # Model files for the Hype Muzik mobile app (live stems: Spleeter ONNX).
    # They live on the host and are bind-mounted read-only at /srv/models —
    # ~79 MB the image and the repo don't need to carry (deploy/models.sha256
    # lists them; the deploy workflow keeps them in place). Paths are versioned
    # (…-v1/), so a URL's bytes never change. `^~` keeps the image-extension
    # regex below from claiming these, and a missing file must be a real 404 —
    # the app falls back to another mirror, while the SPA fallback would answer
    # 200 with index.html.
    location ^~ /models/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      root /srv;
      try_files $uri =404;
    }

    # The usual guesses for a price page (Paddle's reviewers included) reach
    # the real one, instead of the SPA fallback's copy of the homepage.
    # Relative Location: behind the TLS proxy nginx only sees http on :9500, and
    # an absolute redirect would send people to http://hypemuzik.com:9500/.
    location ~ ^/(pricing|supporter)/?$ {
      absolute_redirect off;
      return 301 /support;
    }

    # One URL per page: /support/ → /support. Without this the slashed form
    # fell through to a copy of the homepage — a duplicate at a second URL.
    # `.+` needs a character before the slash, so `/` itself never matches.
    location ~ ^(.+)/$ {
      absolute_redirect off;
      return 301 $1$is_args$args;
    }

    # Every page is prerendered, so a path with no file is a real 404 — not
    # the homepage answering 200, which search engines index as a soft 404 /
    # duplicate. 404.html is SvelteKit's fallback shell (svelte.config.js),
    # which renders src/routes/+error.svelte.
    error_page 404 /404.html;

    location = /404.html {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Prerendered HTML. `no-cache` means "revalidate", not "don't store": a
    # deploy is picked up on the next request instead of after a TTL.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri.html $uri/index.html =404;
    }
  }
}
