<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="HypeMuzik" />
    <meta name="apple-mobile-web-app-title" content="HypeMuzik" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint: the sheet is fetched at
         high priority as a preload, then flipped from `print` to `all` once it
         arrives. Both URLs already carry display=swap, so text is painted in
         the fallback stack either way — this just stops the render from
         waiting on a third party. <noscript> keeps it working without JS. -->
    <link
      rel="preload"
      as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700,900&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <script>
      // Gates the scroll-reveal styles. If anything below fails, the class is
      // never added and every .reveal element simply stays visible.
      document.documentElement.classList.add('js');
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-bg text-text">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // Hero intro gate. Lives here, not in a component, so it runs during HTML
      // parse and the intro never waits on the JS bundles. `go` needs the phone
      // screenshot (the first thing shown) decoded AND >=650ms of ring bloom;
      // past 1.8s we skip the intro rather than hold the headline hostage to a
      // slow image. It also measures where the phone must start so its screen
      // centre sits at the window centre (layout offsets: transform-free).
      (function () {
        var d = document.documentElement, img = document.getElementById('phone-shot');
        var dock = document.getElementById('phone-dock'), cx = dock && dock.offsetParent;
        var decoded = false, waited = false, done = false;
        function end(c) { if (!done) { done = true; d.classList.add(c); } }
        function check() { if (decoded && waited) end('intro-go'); }
        try {
          var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!img || !img.decode || !cx || !d.classList.contains('js') || rm) return end('intro-skip');
          // 0.545 = centre (0.5) + undoing the cluster's static -4.5% shift.
          var dx = cx.offsetWidth * 0.545 - (dock.offsetLeft + dock.offsetWidth / 2);
          var dy = cx.offsetHeight / 2 - (dock.offsetTop + dock.offsetHeight / 2);
          if (!isFinite(dx) || !isFinite(dy) || !cx.offsetWidth) return end('intro-skip');
          d.style.setProperty('--dock-x', dx + 'px');
          d.style.setProperty('--dock-y', dy + 'px');
          img.decode().then(function () { decoded = true; check(); }, function () { end('intro-skip'); });
          setTimeout(function () { waited = true; check(); }, 650);
          setTimeout(function () { end('intro-skip'); }, 1800);
        } catch (e) { end('intro-skip'); }
      })();
    </script>
  </body>
</html>
